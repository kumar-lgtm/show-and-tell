# Tests on every push and pull request, on macOS and Linux.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.24.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: ripgrep (the source search uses it, as on a developer's machine)
        run: if [ "$RUNNER_OS" = macOS ]; then brew install ripgrep; else sudo apt-get update && sudo apt-get install -y ripgrep; fi
      - run: pnpm install --frozen-lockfile
      # The shipped bundle must be exactly what the source builds.
      - run: pnpm build && git diff --exit-code -- dist
      - run: pnpm test
