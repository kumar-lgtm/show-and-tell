# A version tag (v0.2.0) makes a GitHub release. Nothing is published to npm:
# people install from this repo. The workflow builds the package file here,
# never on a laptop, and signs a provenance attestation for it, so anyone can
# check the file came from this repo's workflow at that tag:
#   gh attestation verify kumar-lgtm-show-and-tell-<v>.tgz -R kumar-lgtm/show-and-tell
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'kumar-lgtm/show-and-tell'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write       # the GitHub release
      id-token: write       # signing the attestation
      attestations: write   # storing it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.24.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Tag matches package.json
        run: |
          v="$(node -p 'require("./package.json").version')"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but package.json says $v"; exit 1; }
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && git diff --exit-code -- dist
      - run: node toolbar/verify.mjs
      - run: pnpm test
      - name: Package file and checksum
        run: |
          npm pack
          sha256sum kumar-lgtm-show-and-tell-*.tgz > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: kumar-lgtm-show-and-tell-*.tgz
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" kumar-lgtm-show-and-tell-*.tgz SHA256SUMS --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
