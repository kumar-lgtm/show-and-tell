<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>show-and-tell demo</title>
    <style>
      body { font: 17px/1.55 system-ui, sans-serif; margin: 0; color: #1b1b1b; background: #fafaf8; }
      main { max-width: 640px; margin: 0 auto; padding: 64px 16px; }
      h1 { font-size: clamp(32px, 6vw, 48px); line-height: 1.1; margin: 0 0 16px; }
      .card { background: #fff; border: 1px solid #e4e4e0; border-radius: 10px; padding: 20px; margin-top: 24px; }
      button { font: inherit; padding: 10px 16px; border-radius: 8px; border: 0; background: #1b1b1b; color: #fff; }
    </style>
  </head>
  <body>
    <main>
      <h1>Pricing that scales with your team</h1>
      <p>Pick a plan, invite your team and start shipping. Change or cancel any time.</p>
      <div class="card">
        <h2>Starter</h2>
        <p>Everything a small team needs to get going, billed monthly.</p>
        <button>Start free trial</button>
      </div>
    </main>
  </body>
</html>
